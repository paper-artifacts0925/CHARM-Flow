  gradient_clip_val: 1.0
  accumulate_grad_batches: 4
  reload_dataloaders_every_n_epochs: 0
lightning:
  model_module:
    _target_: src.models.lightning.lightning_module.PlModel
    py_logger: null
    optimizer_cfg: null
    model_cfg: null
  data_module:
    _target_: src.data.data_module.data_module.PretrainingDataModule
  ema:
    decay: 0.9996
    update_steps: 1
  callbacks:
    checkpoint:
      _target_: pytorch_lightning.callbacks.ModelCheckpoint
      every_n_train_steps: 2000
      every_n_epochs: null
      save_top_k: -1
      monitor: null
      mode: min
      filename: '{epoch}-{step}'
      save_last: true
      dirpath: runs/legacy/experiments/pbmc_donoraware_hs3_seed42_v2_boundfix1/pbmc_donoraware_hs3_14k_s42_v2_boundfix1/formal14000/training/checkpoints
    lr_monitor:
      _target_: pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: step
    progress_bar:
      _target_: pytorch_lightning.callbacks.progress.TQDMProgressBar
      refresh_rate: 10
  logger:
    _target_: pytorch_lightning.loggers.logger.DummyLogger
