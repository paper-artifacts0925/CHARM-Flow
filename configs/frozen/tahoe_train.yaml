trainer:
  accelerator: gpu
  devices: 4
  num_nodes: 1
  use_distributed_sampler: false
  default_root_dir: runs/legacy/tahoe_ctxw256_trainonly_hs_seed42_v2/tahoe100m/formal14000/training/trainer
  enable_checkpointing: true
  enable_model_summary: true
  enable_progress_bar: true
  deterministic: true
  check_val_every_n_epoch: 1
  val_check_interval: 1.0
  log_every_n_steps: 20
  num_sanity_val_steps: 0
  max_epochs: null
  max_steps: 14000
  limit_train_batches: null
  limit_val_batches: 0
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2
  reload_dataloaders_every_n_epochs: 0
lightning:
  model_module:
    _target_: src.models.lightning.lightning_module.PlModel
    py_logger: null
    optimizer_cfg: null
    model_cfg: null
  data_module:
    _target_: src.data.data_module.data_module.PretrainingDataModule
  ema:
    decay: 0.9996
    update_steps: 1
  callbacks:
    checkpoint:
      _target_: pytorch_lightning.callbacks.ModelCheckpoint
      every_n_train_steps: 2000
      every_n_epochs: null
      save_top_k: -1
      monitor: null
      mode: min
      filename: '{epoch}-{step}'
      save_last: true
      dirpath: runs/legacy/tahoe_ctxw256_trainonly_hs_seed42_v2/tahoe100m/formal14000/training/checkpoints
    lr_monitor:
      _target_: pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: step
    progress_bar:
      _target_: pytorch_lightning.callbacks.progress.TQDMProgressBar
      refresh_rate: 10
  logger:
    _target_: pytorch_lightning.loggers.logger.DummyLogger
