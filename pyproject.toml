[project]
name = "charm-flow"
version = "0.1.0"
description = "Hierarchical Parent-Child matching and rectified flow for single-cell perturbation prediction"
requires-python = ">=3.11,<3.12"
dependencies = [
  "anndata==0.10.9",
  "cell-eval==0.6.6",
  "geomloss==0.3.1",
  "h5py==3.14.0",
  "huggingface-hub==0.36.2",
  "hydra-core==1.3.4",
  "matplotlib==3.9.4",
  "numpy==2.0.2",
  "omegaconf==2.3.1",
  "pandas==2.3.3",
  "pdex==0.1.26",
  "pytorch-lightning==2.5.6",
  "PyYAML==6.0.3",
  "scanpy==1.10.3",
  "seaborn==0.13.2",
  "scikit-learn==1.6.1",
  "scipy==1.15.2",
  "torch==2.7.1",
  "tqdm==4.69.0",
  "typing-extensions==4.15.0",
  "transformers==4.57.6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
